<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 26 - WASM</title>
</head>
<body>
    <h1>Тестирование WASM-функций</h1>
    <input type="number" id="x" placeholder="Введите x">
    <input type="number" id="y" placeholder="Введите y">
    <button onclick="runFunctions()">Выполнить</button>
    <p>Сумма: <span id="sumResult"></span></p>
    <p>Умножение: <span id="mulResult"></span></p>
    <p>Вычитание: <span id="subResult"></span></p>

    <script src="functions.js"></script>
    <script>
        async function runFunctions() {
            const x = parseInt(document.getElementById('x').value);
            const y = parseInt(document.getElementById('y').value);

            // Вызов функций из WASM
            const sumResult = Module._sum(x, y);
            const mulResult = Module._mul(x, y);
            const subResult = Module._sub(x, y);

            // Вывод результатов
            document.getElementById('sumResult').textContent = sumResult;
            document.getElementById('mulResult').textContent = mulResult;
            document.getElementById('subResult').textContent = subResult;
        }
    </script>
</body>
</html>
