<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автомат с игрушками</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden; 
        } 
        body {
            font-family: Arial, sans-serif;
            color: white;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-image: url('/images/photo1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            min-height: 100vh; 
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7); /* Полупрозрачный черный фон */
            padding: 2vw 4vw; 
            border-radius: 10px;
            text-align: center;
            width: 90%; 
            max-width: 600px; 
            margin: 20px;
            box-sizing: border-box; 
        }
        h1 {
            font-size: clamp(1.5rem, 5vw, 2rem); 
        }
        h3 {
            font-size: clamp(1rem, 3.5vw, 1.5rem); 
        }
        p {
            font-size: clamp(0.9rem, 3vw, 1.2rem); 
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 4vw 6vw; 
                margin: 10px; 
            }
        }
        @media (max-width: 400px) {
            button {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в Симулятор установки</h1>
        <h3>Тема курсового проекта: "Автомат с игрушками"</h3>
        <p>Разработано: Стрелковской Вероникой ФИТ 3_2</p>
        <button onclick="location.href='menu.html'">Перейти к меню</button>
    </div>
</body>
</html>
